[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "req-edit"
version = "0.1.0"
description = "Counterfactual localization and local parameter editing for sequential recommendation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.4"]

[project.optional-dependencies]
sasrec = ["recbole==1.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cler*"]
